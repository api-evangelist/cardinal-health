domain_standard:
  standard: ASC X12 (EDI)
  present: true
  read_from: third-party-integrator-documentation
  contract_declared: false
  note: >-
    ASC X12 is the domain standard for pharmaceutical and medical-surgical
    distribution, and Cardinal Health trades on it at scale. It is NOT declared in a
    contract Cardinal Health publishes, because Cardinal Health publishes no contract —
    a partner learns the transaction set from an onboarding packet, not from a
    fetchable document. That distinction is the finding.
regimes_applicable:
  regimes:
    - HIPAA
    - DSCSA (Drug Supply Chain Security Act)
    - FDA 21 CFR Part 11
  note: >-
    Listed as the regimes that govern this company's data exchange. No conformance
    claim is made for any of them: nothing Cardinal Health publishes was fetchable this
    round that asserts one.
