method: searched
source: >-
  Independent EDI trading-partner directories that publish Cardinal-Health-specific
  mapping guides, corroborated across two vendors. Cardinal Health's own supplier
  guidebook (www.cardinalhealth.com/content/dam/corp/web/documents/Manual/
  cardinalhealth-pharma-supplier-guidebook.pdf) could not be fetched — the Akamai
  edge drops every non-browser connection to that host.
provider: Cardinal Health
providerId: cardinal-health
basis: >-
  READ FROM THIRD-PARTY INTEGRATOR DOCUMENTATION, NOT FROM A CARDINAL HEALTH
  CONTRACT. Cardinal Health publishes no OpenAPI, AsyncAPI, GraphQL SDL or WSDL, so
  none of these assertions could be checked against a machine-readable contract the
  company serves. They are recorded because two independent EDI platforms publish
  Cardinal-Health-specific transaction lists, which is real evidence of the trading
  partner program — but it is second-hand evidence and is marked as such on every row.
